name: "Build & deploy docs"
on:
  # Started by "Test - DEV" and "Build & publish - PROD". Not a part of the latter: a release runs on
  # a tag, which the github-pages environment does not accept.
  workflow_dispatch:
    inputs:
      release:
        description: "Release to publish the docs as (e.g. 1.2.3), the dev version if empty"
        type: string
      ref:
        description: "Branch or tag to build the docs from, the selected branch if empty"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release }}

permissions:
  contents: read

jobs:
  build:
    name: Generate library 📚 documentation 📄
    runs-on: ubuntu-latest
    env:
      MKDOCS_EXECUTE_JUPYTER: false # execution is done before rendering documentation
      MKDOCS_DEV: ${{ inputs.release == '' }}
      MKDOCS_GENERATE_SOCIAL_CARDS: true
      FORCE_TERMINAL_MODE: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CICD_PAT_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image libraries
        run: sudo apt-get install libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dev-${{ hashFiles('**/pdm.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-dev-
      - name: Install pdm
        run: pip install pdm uv
      - name: Regenerate lock with environment markers
        run: pdm lock --update-reuse --strategy inherit_metadata
      - name: Generate requirements.txt
        run: pdm export --no-default -G docs -G visualization -G cli-dev -f requirements -o requirements.txt
      - name: Install dependencies
        run: uv pip install --no-deps -r requirements.txt --system
      - name: Install overturemaestro
        run: |
          pdm build -v -d dist
          # The h3 extension is not available for DuckDB 2.0.1
          uv pip install "duckdb<2.0" 'overturemaestro[cli] @ file://'"$(pwd)/$(find dist -name '*.whl')" --system
      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Prepare DuckDB dependency
        run: |
          wget https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip duckdb_cli-linux-amd64.zip
          chmod a+x ./duckdb
      - name: Test required commands
        run: |
          ./duckdb :memory: "SELECT 1"
          OvertureMaestro -h
      - name: Execute jupyter notebooks
        run: |
          mv ./duckdb ./examples/duckdb
          jupyter nbconvert --to notebook --inplace --execute $(find examples/ -type f -name "*.ipynb") --ExecutePreprocessor.kernel_name='python3'
          rm ./examples/duckdb
      - uses: jannekem/run-python-script-action@v1
        name: Replace copyright date
        with:
          script: |
            import time
            file_name = "mkdocs.yml"
            with open(file_name) as f:
                data = f.read().replace('{current_year}', time.strftime("%Y"))
            with open(file_name, "w") as f:
                f.write(data)
      - name: Create remote for overturemaestro-docs repository
        run: git remote add origin-overturemaestro-docs https://github.com/kraina-ai/overturemaestro-docs
      - name: Fetch gh-pages branch
        run: git fetch origin-overturemaestro-docs gh-pages --depth=1
      - name: Publish documentation
        run: |
          if [ -z "$RELEASE" ]; then
            mike deploy --remote origin-overturemaestro-docs --push dev
          else
            mike deploy --remote origin-overturemaestro-docs --push --update-aliases "${RELEASE%.*}" latest
          fi
        env:
          RELEASE: ${{ inputs.release }}

  deploy:
    name: "Deploy docs job"
    needs: [build]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/redeploy_docs.yml
    secrets:
      CICD_PAT_TOKEN: ${{ secrets.CICD_PAT_TOKEN }}
